<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · Pitch Session Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --color-primary:#2B7FFF; --color-primary-text:#027BFC; --color-primary-hover:#1C6EF0; --color-primary-active:#1559CC;
  --color-primary-soft:#EBF3FF; --color-primary-tint:#EBF3FF; --color-primary-border:#B4D1FF; --color-primary-ink:#027BFC;
  --color-page:#F6F8FA; --color-surface:#FFFFFF; --color-surface-subtle:#F9FAFB; --color-surface-muted:#F1F5F9;
  --color-border:#E5E7EB; --color-border-subtle:#EEF2F6; --color-separator:#E6EAF0;
  --color-text:#111827; --color-text-muted:#4B5563; --color-text-soft:#6B7280; --color-text-disabled:#9CA3AF; --color-text-inverse:#FFFFFF;
  --color-warning:#D97706; --color-warning-soft:#FEF3C7; --color-warning-ink:#92400E;
  /* status palette */
  --c-plan:#5CA423; --c-plan-soft:#EFFAE6;
  --c-partial:#E58600; --c-partial-ink:#E58600; --c-partial-soft:#FFEED6;
  --c-review:#E50C00; --c-review-soft:#FFE7E5;
  --c-notobs:#9CA3AF; --c-notobs-soft:#EEF1F4;
  --c-dot:#16A34A; /* calendar session dot (green, per reference) */
  --sb-steel:#A3C9FF; --sb-steel2:#A3C9FF; --sb-grey:#AFAFBB; --sb-green:#9CDE68; --sb-gold:#FFB54D; --sb-clay:#FF8680;
  --r-sm:6px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04); --shadow-pop:0 16px 40px rgba(15,23,42,.18);
  --ff:"Inter Display","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --side:240px; --top:52px;
  /* right inset that matches .wrap's content right edge (max-width 1420, 28px pad), at any width */
  --rail-inset:max(28px, calc((100vw - var(--side) - 1420px)/2 + 28px));
}
*{margin:0;padding:0;box-sizing:border-box;corner-shape:squircle}
/* keep true circles circular, not squircle */
.avatar,.pnum,.brand .mark,.exc,.thumb .play,.sd,.dw-ex-thumb .pl span,.exlb-pbig span,.hl-play span{corner-shape:round}
body{font-family:var(--ff);background:var(--color-page);color:var(--color-text);font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;line-height:14px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--color-text-soft)}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff)}

/* ---------- app shell ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--color-surface);border-bottom:1px solid var(--color-separator);display:flex;align-items:center;gap:14px;padding:0 var(--rail-inset) 0 20px;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em}
.brand .mark{display:inline-grid;place-items:center;color:var(--color-text)}
.brand .mark svg{height:22px;width:auto;display:block}
.brandlogo{height:22px;width:auto;display:block;color:var(--color-text)}
.brand .club{color:var(--color-text-soft);font-weight:600;font-size:13px;padding-left:12px;border-left:1px solid var(--color-separator)}
.topclub{color:var(--color-text-soft);font-weight:600;font-size:13px;padding-right:14px;margin-right:2px;border-right:1px solid var(--color-separator)}
.topbar .sp{flex:1}
.btn{font-size:13px;font-weight:600;border-radius:var(--r-lg);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.btn:hover{background:var(--color-surface-subtle)}
.btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.btn.primary:hover{background:var(--color-primary-hover)}
.btn svg{width:16px;height:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--color-surface);border-right:1px solid var(--color-separator);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:30;transition:width .2s ease}
.side .grp{margin:14px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);border:1px solid transparent;color:var(--color-text-soft);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none}
.nav svg{width:18px;height:18px;color:var(--color-text-soft)}
.nav:hover{background:var(--color-surface-subtle)}
.nav.disabled{cursor:default;pointer-events:none}
.nav.active{background:var(--color-surface-muted);border-color:rgba(31,43,39,.03);color:var(--color-text);font-weight:600}
.nav.active svg{color:var(--color-text)}
.nav .badge{margin-left:auto;background:var(--color-warning-soft);color:var(--color-warning-ink);font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:1px 8px}
.navtoggle{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;flex:none}
.navtoggle:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.navtoggle svg{width:18px;height:18px}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sidecta{width:100%;justify-content:center;background:var(--color-primary-tint);border-color:var(--color-primary-text);color:var(--color-primary-text);font-weight:700}
.sidecta:hover{background:#DCEAFF}
.profile{display:flex;align-items:center;gap:10px;padding:2px}
.profile .pname{font-size:13px;font-weight:600;color:var(--color-text)}
body.nav-collapsed{--side:64px}
body.nav-collapsed .side{padding:16px 8px}
body.nav-collapsed .side .grp{display:none}
body.nav-collapsed .nav{position:relative;justify-content:center;padding:9px 0;gap:0}
body.nav-collapsed .nav .lbl{display:none}
body.nav-collapsed .nav .badge{position:absolute;top:1px;right:9px;margin:0;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;line-height:1}
body.nav-collapsed .side-foot{align-items:center}
body.nav-collapsed .sidecta{width:36px;padding:0}
body.nav-collapsed .sidecta .lbl{display:none}
body.nav-collapsed .profile .pname{display:none}
.main{margin-left:var(--side);margin-top:var(--top);transition:margin-left .2s ease;padding-bottom:70px}

/* ---------- week strip ---------- */
.weekstrip{display:flex;align-items:center;gap:3px;background:var(--color-surface);border-bottom:1px solid var(--color-separator);padding:8px var(--rail-inset) 8px 24px}
.datelabel{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--color-text);white-space:nowrap;cursor:pointer;padding:6px 0 6px 8px;border-radius:var(--r-md);border:0;background:none;font-family:inherit}
.datelabel:hover{background:var(--color-surface-subtle)}
.datelabel:focus{outline:none}
.datelabel #dateLabelTxt{display:inline-block}
.datelabel .dl-chev{margin-left:-3px}
.datelabel svg{width:16px;height:16px;color:var(--color-text-soft)}
.datelabel .dl-chev{width:14px;height:14px}
/* custom date popup */
.dp-anchor{position:relative;display:inline-flex}
.weekstrip .dp-anchor{margin-left:auto}
.datepop{position:absolute;top:calc(100% + 10px);right:0;left:auto;z-index:50;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:14px;width:296px}
.datepop[hidden]{display:none}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-my{font-size:14px;font-weight:700;color:var(--color-text)}
.dp-nav{display:flex;gap:4px}
.dp-arrow{width:28px;height:28px;border:0;background:none;border-radius:var(--r-md);color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer}
.dp-arrow:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.dp-arrow svg{width:16px;height:16px}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.dp-dow span{text-align:center;font-size:11px;font-weight:600;color:var(--color-text-soft);padding:4px 0}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-cell{aspect-ratio:1;border:0;background:none;border-radius:var(--r-md);font-family:inherit;font-size:13px;font-weight:500;color:var(--color-text);cursor:pointer;display:grid;place-items:center;position:relative}
.dp-cell:hover{background:var(--color-surface-subtle)}
.dp-cell.out{color:var(--color-text-disabled)}
.dp-cell.disabled{color:var(--color-text-disabled);opacity:.4;cursor:default;pointer-events:none}
.dp-cell.today{font-weight:700}
.dp-cell.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--c-plan)}
.dp-cell.sel{background:var(--color-primary);color:#fff;font-weight:600}
.dp-cell.sel:hover{background:var(--color-primary-hover)}
.dp-cell.sel.today::after{background:#fff}
.dp-foot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--color-separator)}
.dp-today{border:0;background:none;color:var(--color-primary-text);font-size:13px;font-weight:600;cursor:pointer;padding:5px 10px;border-radius:var(--r-md);font-family:inherit}
.dp-today:hover{background:var(--color-primary-tint)}
.weeknav{width:28px;height:40px;border:0;background:none;color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;border-radius:var(--r-md)}
.weeknav:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.weeknav svg{width:18px;height:18px}
.days{display:flex;gap:6px;margin:0 10px 0 18px}
.day{width:60px;padding:6px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:var(--r-md);position:relative;background:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.day .dow{font-size:11px;font-weight:500;color:var(--color-text-soft)}
.day .dnum{font-size:16px;font-weight:600;color:var(--color-text);font-variant-numeric:tabular-nums}
.day.sel{background:var(--color-primary-tint)}
.day.sel .dow{color:var(--color-text)}
.day.sel .dnum{color:var(--color-primary-text);font-weight:700}
.day.future{opacity:.55;cursor:default;pointer-events:none}
.day.future .dnum{color:var(--color-text-disabled)}
.todaybtn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border:0;background:none;color:var(--color-primary-text);border-radius:var(--r-md);padding:7px 10px;cursor:pointer;white-space:nowrap;margin-left:2px}
.todaybtn svg{width:15px;height:15px}
.todaybtn:hover{background:var(--color-surface-subtle)}

/* ---------- content ---------- */
.wrap{max-width:1420px;margin:0 auto;padding:22px 28px 0}
.crumb{font-size:12.5px;color:var(--color-text-soft);margin-bottom:8px}
.crumb b{color:var(--color-text-muted);font-weight:600}
.phead{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:4px}
.phead .pt{flex:1;min-width:0}
.titleline{display:flex;align-items:center;gap:12px}
h1{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.01em}
.sessnav{width:38px;height:38px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-md);color:var(--color-text);display:grid;place-items:center;cursor:pointer;flex:none}
.sessnav:hover{background:var(--color-surface-subtle)}
.sessnav:disabled{color:var(--color-text-disabled);cursor:default;background:var(--color-surface)}
.sessnav:disabled:hover{background:var(--color-surface)}
.sessnav svg{width:20px;height:20px}
.sesstitle-wrap{position:relative;display:inline-flex}
.sesstitle-btn{display:inline-flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;padding:0;font-family:inherit}
.sesstitle-btn .st-chev{width:22px;height:22px;color:var(--color-text-soft);flex:none}
.sesscount{font-size:14px;color:var(--color-text-soft);font-weight:500}
.sesspop{position:absolute;top:calc(100% + 10px);left:0;z-index:50;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:6px;min-width:300px}
.sesspop[hidden]{display:none}
.sessrow{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;cursor:pointer;padding:11px 14px;border-radius:var(--r-md);font-family:inherit;text-align:left}
.sessrow:hover{background:var(--color-surface-subtle)}
.sessrow.active{background:var(--color-primary-tint)}
.sr-time{font-size:14px;color:var(--color-text-soft);width:48px;flex:none}
.sessrow.active .sr-time{color:var(--color-primary-ink)}
.sr-name{font-size:15px;font-weight:600;color:var(--color-text)}
.sessrow.active .sr-name{color:var(--color-primary-ink)}
.sr-check{margin-left:auto;color:var(--color-primary-text);display:none;place-items:center}
.sessrow.active .sr-check{display:inline-grid}
.sr-check svg{width:18px;height:18px}
.donepill{display:inline-flex;align-items:center;gap:5px;background:var(--c-plan-soft);color:var(--c-plan);font-size:12px;font-weight:600;border-radius:var(--r-pill);padding:5px 11px}
.donepill svg{width:14px;height:14px}
.sublinerow{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:11px}
.subline{font-size:13px;color:var(--color-text-soft)}
.gymloc{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--color-text-soft);white-space:nowrap}
.gymloc svg{width:14px;height:14px}
.headacts{display:flex;gap:10px;align-self:flex-start;padding-top:4px}
.headacts .btn{height:40px}

.cols{display:flex;gap:20px;align-items:flex-start;margin-top:20px}
.col-main{flex:1;min-width:0}
.col-rail{width:328px;flex:none}
.panel{background:var(--color-surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}

/* attendance + completion */
.statspanel{padding:20px;margin-bottom:20px}
/* session highlights banner */
.highlightbox{display:flex;align-items:center;gap:18px;padding:14px 16px;margin-bottom:20px;cursor:pointer}
.highlightbox:hover{background:var(--color-surface-subtle)}
.hl-thumb{position:relative;width:128px;height:72px;border-radius:var(--r-md);overflow:hidden;flex:none;background:var(--color-surface-muted)}
.hl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hl-play{position:absolute;inset:0;display:grid;place-items:center}
.hl-play span{width:34px;height:34px;border-radius:50%;background:rgba(17,24,39,.55);display:grid;place-items:center;color:#fff}
.hl-play span svg{width:16px;height:16px;margin-left:2px}
.hl-play span svg path{stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.hl-dur{position:absolute;right:5px;bottom:5px;background:rgba(17,24,39,.78);color:#fff;font-size:10px;font-weight:600;border-radius:4px;padding:1px 5px}
.hl-text{flex:1;min-width:0}
.hl-title{font-size:15px;font-weight:700;color:var(--color-text)}
.hl-sub{font-size:12.5px;color:var(--color-text-soft);margin-top:2px}
.hl-cta{flex:none;background:var(--color-primary-tint);border-color:var(--color-primary-text);color:var(--color-primary-text);font-weight:700}
.hl-cta svg{width:15px;height:15px}
@media(max-width:560px){.highlightbox{flex-wrap:wrap}.hl-cta{width:100%;justify-content:center}}
.statgroups{display:flex}
.statgroup{flex:1;padding:2px 0;min-width:0}
.sg-sep{width:1px;background:var(--color-separator);margin:2px 32px}
.sg-title{font-size:14px;font-weight:700;color:var(--color-text);margin-bottom:15px}
.sg-rows{display:flex;flex-direction:column;gap:13px}
.sgrow{display:flex;align-items:center;gap:14px}
.sg-lab{width:106px;flex:none;font-size:13px;color:var(--color-text-muted)}
.sg-track{flex:1;height:10px;border-radius:4px;background:var(--color-surface-muted);overflow:hidden}
.sg-track>i{display:block;height:100%;border-radius:4px}
.sg-val{width:26px;flex:none;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--color-text)}
.sg-foot{font-size:11.5px;color:var(--color-text-disabled);margin-top:15px}
@media(max-width:640px){.statgroups{flex-direction:column;gap:18px}.sg-sep{display:none}.statgroup{padding:0}}

/* player completion */
.tablepanel{padding:18px 20px 8px}
.tphead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tphead .selectwrap{margin-left:auto}
.topsearch-gym{display:flex;align-items:center;gap:7px;height:34px;width:190px;border:1px solid var(--color-border);border-radius:var(--r-md);background:var(--color-surface-subtle);padding:0 11px}
.topsearch-gym:focus-within{background:var(--color-surface);border-color:var(--color-primary-border);box-shadow:0 0 0 3px var(--color-primary-soft)}
.topsearch-gym>svg{width:15px;height:15px;color:var(--color-text-soft);flex:none}
.topsearch-gym input{flex:1;border:0;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--color-text);min-width:0}
.topsearch-gym input::placeholder{color:var(--color-text-soft)}
.seg{display:inline-flex;background:var(--color-surface-muted);border-radius:var(--r-md);padding:3px}
.segb{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--color-text-soft);padding:6px 13px;border-radius:7px;cursor:pointer}
.segb.active{background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-card)}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--color-border);border-radius:var(--r-md);padding:0 11px;height:36px;background:var(--color-surface)}
.search svg{width:15px;height:15px;color:var(--color-text-soft)}
.search input{border:0;outline:0;font-family:inherit;font-size:13px;width:140px;background:none;color:var(--color-text)}
.selectwrap{position:relative;display:inline-flex;align-items:center}
.selectwrap select{appearance:none;border:1px solid var(--color-border);border-radius:var(--r-md);height:36px;padding:0 32px 0 12px;font-family:inherit;font-size:13px;font-weight:500;color:var(--color-text);background:var(--color-surface);cursor:pointer}
.selectwrap svg{width:15px;height:15px;color:var(--color-text-soft);position:absolute;right:10px;pointer-events:none}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin-bottom:4px}
.ptab{border:0;background:none;font-size:13px;font-weight:500;color:var(--color-text-soft);padding:8px 12px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.ptab span{color:var(--color-text-soft);font-weight:500;font-size:12px}
.ptab-dot{width:7px;height:7px;border-radius:50%;corner-shape:round;flex:none;display:inline-block}
.ptab.active{color:var(--color-text);border-bottom-color:var(--color-primary-text);font-weight:600}
.ptab.active span{color:var(--color-text);font-weight:600}

.ptable{width:100%;border-collapse:collapse}
.ptable th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600;padding:12px 12px 10px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.ptable th.sortable{cursor:pointer;user-select:none}
.ptable th .sico{width:13px;height:13px;vertical-align:-2px;margin-left:3px;color:var(--color-text-disabled)}
.ptable td{padding:10px 12px;border-bottom:1px solid var(--color-border-subtle);font-size:13.5px;vertical-align:middle}
.ptable tbody tr:last-child td{border-bottom:0}
.prow{cursor:pointer}
.prow:hover td{background:var(--color-surface-subtle)}
.pcell{display:flex;align-items:center;gap:10px}
.pnum{width:30px;height:30px;border-radius:50%;background:var(--color-primary-tint);color:var(--color-primary-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;overflow:hidden}
.pnum.pphoto{background:var(--color-surface-muted)}
.pnum img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.pname{font-weight:600}
.exrow{display:flex;gap:6px}
.ptable th.exc-col,.ptable td.exc-col{text-align:center}
.exc-col .exrow{justify-content:center}
.exc{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.exc svg{width:12px;height:12px;stroke-width:3}
.exc.p svg{stroke-width:4}
.exc.o{background:var(--c-plan-soft);color:var(--c-plan)}
.exc.p{background:var(--c-partial-soft);color:var(--c-partial-ink)}
.exc.f{background:var(--c-review-soft);color:var(--c-review);font-size:12px;font-weight:800}
.exc.n{background:var(--color-surface-muted)}
.exc.n::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--color-text-disabled)}
.stag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.stag .sd{width:6px;height:6px;border-radius:50%;flex:none}
.stag.plan{color:var(--c-plan)} .stag.partial{color:var(--c-partial-ink)} .stag.review{color:var(--c-review)} .stag.notobs{color:var(--color-text-soft)}
.tdet{color:var(--color-text-muted)}
.chev{color:var(--color-text-disabled)}
.chev svg{width:16px;height:16px}
.minibar{width:90px;height:7px;border-radius:var(--r-pill);background:var(--color-surface-muted);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.minibar>i{display:block;height:100%;background:var(--c-plan);border-radius:var(--r-pill)}

/* exercises view: per-player breakdown */
.exlegend{margin-left:auto;display:flex;align-items:center;gap:16px;padding-bottom:6px}
.exlegend>span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--color-text-muted)}
.exlegend .lgi{width:20px;height:20px;display:inline-grid;place-items:center}
.extable{table-layout:fixed}
.extable th.ex-c,.extable td.ex-c{text-align:center}
.extable col.c-presc,.extable col.c-done{width:150px}
.extable col.c-status{width:120px}
.extable td.ex-c.num{color:var(--color-text-muted);font-variant-numeric:tabular-nums}
.exgroup{cursor:pointer}
.exgroup>td{background:var(--color-surface-subtle);border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);padding:11px 12px}
.exgroup:hover>td{background:var(--color-surface-muted)}
.exg-inner{display:flex;align-items:center;gap:11px}
.exg-chev{width:18px;height:18px;color:var(--color-text-soft);flex:none;transition:transform .15s}
.exgroup.collapsed .exg-chev{transform:rotate(-90deg)}
.exg-name{font-weight:700;color:var(--color-text)}
.exg-bar{width:1px;height:15px;background:var(--color-separator);margin:0 2px;flex:none}
.exg-prog{color:var(--color-text-muted);font-size:13.5px}
.exg-count{margin-left:auto;font-size:13px;color:var(--color-text-soft);white-space:nowrap}
.exitem>td{padding:11px 12px;border-bottom:1px solid var(--color-border-subtle);font-size:13.5px}
.exitem .ex-name{padding-left:34px;color:var(--color-text)}
.exitem.playable{cursor:pointer}
.exitem.playable:hover>td{background:var(--color-surface-subtle)}
.sti{display:inline-grid;place-items:center;width:20px;height:20px;vertical-align:middle}
.sti svg{width:20px;height:20px}

.tfoot{display:flex;align-items:center;justify-content:flex-end;padding:14px 4px;font-size:13px;color:var(--color-text-soft)}
.tfoot:empty{display:none}
.pager{display:flex;gap:4px;align-items:center}
.pgb{min-width:30px;height:30px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-md);font-size:13px;font-weight:600;color:var(--color-text-muted);cursor:pointer;display:grid;place-items:center;padding:0 7px}
.pgb:hover{background:var(--color-surface-subtle)}
.pgb.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.pgb:disabled{opacity:.4;cursor:default}
.pgb svg{width:15px;height:15px}

/* right rail */
.railcard{padding:16px 18px;margin-bottom:16px}
.rc-head{display:flex;align-items:baseline;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:12px}
.rc-count{font-size:12px;color:var(--color-text-soft);font-weight:500}
.rc-title{display:inline-flex;align-items:center;gap:8px}
.rc-ic{width:22px;height:22px;border-radius:50%;background:var(--c-review-soft);color:var(--c-review);display:inline-grid;place-items:center;flex:none;font-size:14px;font-weight:800;line-height:1}
.rc-ic svg{width:14px;height:14px}
.clipcard{border:1px solid var(--color-border);border-radius:var(--r-md);padding:12px;margin-bottom:12px}
.clipcard:last-child{margin-bottom:0}
.cc-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.cc-top .pnum{width:32px;height:32px;font-size:11px}
.cc-name{font-size:14px;font-weight:600}
.cc-prog{font-size:12px;color:var(--color-text-soft);margin-top:2px}
.cc-flag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--c-review);background:var(--c-review-soft);padding:3px 9px;border-radius:var(--r-pill)}
.cc-flag svg{width:13px;height:13px}
.thumb{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:16/9;background:var(--color-surface-muted);margin-bottom:10px}
.dw-body>.thumb{margin-bottom:calc(8px - 28px)} /* net 8px gap to the capture section (offsets the 28px column gap) */
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:rgba(17,24,39,.55);color:#fff;display:grid;place-items:center}
.thumb .play svg{width:26px;height:26px;margin-left:3px}
.thumb .play svg path,.dw-ex-thumb .pl span svg path,.exlb-pbig span svg path{stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.thumb .dur{position:absolute;right:7px;bottom:7px;background:rgba(17,24,39,.75);color:#fff;font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px}
.cc-title{font-size:14px;font-weight:600}
.cc-note{font-size:12.5px;color:var(--color-text-muted);margin-top:2px}
.cc-pend{font-size:11.5px;color:var(--color-text-soft);margin-top:4px}
.cc-cta{display:inline-block;margin-top:10px;color:var(--color-primary-text);font-size:13px;font-weight:600;cursor:pointer}
.cov{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--color-text-muted);margin-bottom:6px}
.cov svg{width:18px;height:18px;color:var(--color-text-soft)}
.cov b{color:var(--color-text);font-weight:700}
.camgrid{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.camrow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--color-text)}
.camrow .camdot{width:7px;height:7px;border-radius:50%;background:var(--c-plan);flex:none}
.camrow b{font-weight:700}
.camrow .camzone{color:var(--color-text-soft)}
.camnote{font-size:12px;color:var(--color-text-soft);line-height:1.55;margin-top:12px;padding-top:11px;border-top:1px solid var(--color-border-subtle)}
.railfoot{font-size:11px;color:var(--color-text-disabled);text-align:center;padding:4px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--color-surface);box-shadow:var(--shadow-pop);transform:translateX(100%);transition:transform .22s ease;z-index:61;display:flex;flex-direction:column;overflow:auto}
.drawer.open{transform:none}
.dw-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--color-separator)}
.dw-head .pnum{width:40px;height:40px}
.dw-head .cc-name{font-size:16px}
.dw-head .cc-prog{font-size:14px}
.dw-close{margin-left:auto;width:32px;height:32px;border:1px solid var(--color-border);background:none;border-radius:var(--r-md);cursor:pointer;display:grid;place-items:center;color:var(--color-text-soft)}
.dw-close svg{width:16px;height:16px}
.dw-body{padding:18px 20px;display:flex;flex-direction:column;gap:28px}
.dw-sec .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600;margin-bottom:6px}
.dw-sec p{font-size:13.5px;line-height:1.5;color:var(--color-text)}
.forcoach{border-left:3px solid var(--color-primary-border);background:var(--color-primary-tint);padding:10px 12px;border-radius:0 var(--r-md) var(--r-md) 0}
.verdicts{display:flex;gap:8px}
.vbtn{flex:1;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-md);padding:10px;font-size:13px;font-weight:600;color:var(--color-text-muted);cursor:pointer}
.vbtn:hover{background:var(--color-surface-subtle)}
.vbtn.confirm{color:var(--color-primary-text);background:var(--color-primary-tint);border-color:var(--color-primary-border)}
.vd-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:14px;font-weight:700;color:var(--color-primary-text);background:var(--color-primary-tint);border:1px solid var(--color-primary-text);border-radius:var(--r-lg);padding:11px 14px;cursor:pointer;font-family:inherit}
.vd-primary:hover{background:#DCEAFF}
.vd-primary svg{width:17px;height:17px}
.vd-actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:12px}
.vd-act{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--color-primary-text);background:none;border:0;padding:0;cursor:pointer;font-family:inherit;justify-self:center}
.vd-act svg{width:16px;height:16px}
.vd-act:hover{color:var(--color-primary-hover)}
.vd-sep{width:1px;height:16px;background:var(--color-border)}
.vd-legend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.vd-legend li{font-size:12.5px;color:var(--color-text-soft);line-height:1.45;display:flex;gap:8px}
.vd-legend b{flex:none;min-width:58px;color:var(--color-text-muted);font-weight:650}
.vd-card{border:1px solid var(--color-border);border-radius:var(--r-lg);padding:14px 16px;background:var(--color-surface)}
.vd-sub{font-size:13.5px;line-height:1.5;color:var(--color-text);margin-bottom:14px}
/* ---- per-set review drawer (review + partial) ---- */
.rv2-av{position:relative;display:inline-flex}
.rv2-avnum{position:absolute;left:-3px;bottom:-4px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:5px;font-size:10px;font-weight:700;color:var(--color-text-muted);padding:0 4px;line-height:15px}
.rv2-head-txt{min-width:0}
.rv2-head-sub{display:flex;align-items:center;gap:9px;margin-top:3px}
.rv2-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;color:var(--c-partial-ink);background:var(--c-partial-soft)}
.rv2-pill-review{color:var(--c-review);background:var(--c-review-soft)}
.rv2-pdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.rv2-body{gap:16px}
.rv2-body>.thumb{margin:0}
.rv2-body>.dw-sec{margin-top:20px} /* +20px gap between the review card and the assigned-exercises list */
.rv2-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rv2-title{display:flex;align-items:center;gap:11px;min-width:0}
.rv2-title b{font-size:16px;font-weight:600;color:var(--color-text)}
.rv2-vsep{flex:none;width:1px;height:16px;background:var(--color-border)}
.rv2-set{font-size:14px;color:var(--color-text-soft)}
.rv2-pager{display:flex;align-items:center;gap:8px;flex:none}
.rv2-count{font-size:13px;color:var(--color-text-soft);margin-right:2px}
.rv2-arrow{width:34px;height:32px;display:grid;place-items:center;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-md);cursor:pointer;color:var(--color-text-muted)}
.rv2-arrow:hover:not(:disabled){background:var(--color-surface-subtle)}
.rv2-arrow:disabled{opacity:.4;cursor:default}
.rv2-arrow svg{width:17px;height:17px}
.rv2-issue{display:flex;gap:10px;align-items:flex-start}
.rv2-issue-ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c-review-soft);color:var(--c-review);font-size:14px;font-weight:800;line-height:1;margin-top:1px} /* same as the "Needs attention" red chip (.rc-ic) */
.rv2-issue.is-partial .rv2-issue-ic{background:var(--c-partial-soft);color:var(--c-partial-ink)}
.rv2-issue.is-notobs .rv2-issue-ic{background:var(--c-notobs-soft);color:var(--color-text-soft)}
.rv2-issue-ic svg{width:15px;height:15px}
.rv2-issue-t{font-size:14px;font-weight:600;color:var(--color-text)}
.rv2-issue-d{font-size:13px;color:var(--color-text-soft);line-height:1.45;margin-top:1px}
.rv2-card{border-top:1px solid var(--color-border);padding-top:16px}
.rv2-rtitle{font-size:16px;font-weight:600;color:var(--color-text)}
.rv2-rsub{font-size:13px;color:var(--color-text-soft);margin-top:2px}
.rv2-stats{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:14px 0 16px}
.rv2-stats-one{grid-template-columns:1fr}
.rv2-vline{width:1px;height:38px;background:var(--color-border)}
.rv2-stat-l{font-size:12.5px;color:var(--color-text-soft);margin-bottom:5px}
.rv2-stat-v{font-size:17px;font-weight:600;color:var(--color-text)}
.rv2-amber{display:flex;align-items:center;gap:7px;color:var(--c-partial-ink)}
.rv2-dot{width:9px;height:9px;border-radius:50%;background:var(--c-partial)}
.rv2-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv2-actions-gap{margin-top:14px}
.rv2-actions .btn{height:40px;width:100%;justify-content:center} /* match the session-planner buttons */
.rv2-actions .btn.rv2-confirm{background:var(--color-primary-tint);border-color:var(--color-primary-text);color:var(--color-primary-text);font-weight:700} /* tint secondary CTA, like "Plan a session" (.sidecta), without its click handler */
.rv2-actions .btn.rv2-confirm:hover{background:#DCEAFF}
.rv2-actions .btn.rv2-confirm svg{stroke-width:2.2} /* thicker tick */
.rv2-actions .btn:not(.rv2-confirm) svg{width:14px;height:14px} /* smaller pencil */
.rv2-dismiss-wrap{text-align:right;margin-top:12px}
.rv2-dismiss{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--color-text-soft);background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:2px}
.rv2-dismiss:hover{color:var(--color-text-muted)}
.rv2-dismiss svg{width:15px;height:15px}
.dw-note{font-size:12px;color:var(--color-text-soft);text-align:center}
/* session plan drawer */
.dw-plan-name{font-size:18px;font-weight:700;color:var(--color-text);margin-top:3px}
.plan-meta{display:flex;flex-direction:column;gap:11px;background:var(--color-surface-subtle);border:1px solid var(--color-border);border-radius:var(--r-md);padding:14px 16px}
.pm-item{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--color-text-muted)}
.pm-item svg{width:16px;height:16px;color:var(--color-text-soft);flex:none}
.pm-item b{color:var(--color-text);font-weight:600}
.timeline{display:flex;flex-direction:column}
.tl-row{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid var(--color-border-subtle)}
.tl-row:last-child{border-bottom:0;padding-bottom:0}
.tl-time{font-size:13px;font-weight:600;color:var(--color-text);width:46px;flex:none}
.tl-main{flex:1;min-width:0}
.tl-name{font-size:13.5px;font-weight:600;color:var(--color-text)}
.tl-note{font-size:12.5px;color:var(--color-text-soft);margin-top:2px}
.tl-dur{font-size:12px;color:var(--color-text-soft);flex:none;padding-top:1px}
.plan-prog{border:1px solid var(--color-border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.plan-prog:last-child{margin-bottom:0}
.pp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pp-name{font-size:13.5px;font-weight:700;color:var(--color-text)}
.pp-count{font-size:11.5px;color:var(--color-text-soft);background:var(--color-surface-muted);border-radius:var(--r-pill);padding:2px 9px;font-weight:600}
.pp-ex{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--color-border-subtle)}
.pp-ex:first-of-type{border-top:0}
.pp-ex-name{font-size:13px;color:var(--color-text)}
.pp-ex-rx{font-size:12.5px;color:var(--color-text-muted);white-space:nowrap}
.plan-foot{font-size:11.5px;color:var(--color-text-disabled);padding-top:2px}
/* drawer: assigned-exercise breakdown */
.dw-exc-head{display:flex;align-items:center;justify-content:space-between}
.dw-exc-count{text-transform:none;letter-spacing:0;font-weight:500;color:var(--color-text-soft);font-size:12px}
.dw-exlist{border:1px solid var(--color-border);border-radius:var(--r-md);overflow:hidden}
.dw-exrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--color-border-subtle)}
.dw-exrow:last-child{border-bottom:0}
.dw-ex-main{flex:1;min-width:0}
.dw-ex-name{font-size:13.5px;font-weight:600;color:var(--color-text)}
.dw-ex-meta{font-size:12px;color:var(--color-text-soft);margin-top:2px}
.dw-exrow .sti{flex:none}
.dw-exleg{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px}
.dw-exleg>span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--color-text-muted)}
.dw-exleg .lgi{width:20px;height:20px;display:inline-grid;place-items:center;flex:none}
/* per-exercise video thumbnail (YouTube-style) */
.dw-ex-thumbs{display:flex;gap:6px;flex:none}
.dw-ex-thumb{position:relative;width:76px;height:46px;border-radius:7px;overflow:hidden;flex:none;background:var(--color-surface-muted);cursor:pointer}
.dw-ex-thumb.blank{cursor:default;background:var(--color-surface-muted) center/cover no-repeat url('clips/placeholder_thumb.jpg')}
.thumb.blank{background:var(--color-surface-muted) center/cover no-repeat url('clips/placeholder_thumb.jpg')}
.dw-ex-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dw-ex-thumb .pl{position:absolute;inset:0;display:grid;place-items:center}
.dw-ex-thumb .pl span{width:24px;height:24px;border-radius:50%;background:rgba(17,24,39,.6);display:grid;place-items:center;color:#fff}
.dw-ex-thumb .pl span svg{width:13px;height:13px;margin-left:1px}
.dw-ex-thumb:hover .pl span{background:var(--color-primary)}
.dw-ex-thumb .dur{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.78);color:#fff;font-size:9px;font-weight:600;border-radius:3px;padding:0 3px;font-variant-numeric:tabular-nums}
.dw-ex-thumb.nofoot{cursor:default;display:grid;place-items:center;border:1px dashed var(--color-border)}
.dw-ex-thumb.nofoot svg{width:18px;height:18px;color:var(--color-text-disabled)}
/* exercise clip lightbox */
.exlb{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(17,24,39,.55);padding:24px}
.exlb.open{display:flex}
.exlb-card{background:var(--color-surface);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);width:min(840px,94vw);overflow:hidden;position:relative}
.exlb-x{position:absolute;top:10px;right:10px;z-index:2;width:30px;height:30px;border-radius:var(--r-md);border:0;background:rgba(17,24,39,.5);color:#fff;cursor:pointer;display:grid;place-items:center}
.exlb-x svg{width:16px;height:16px}
.exlb-video{position:relative;aspect-ratio:16/9;background:#000}
.exlb-video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.exlb-video video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.exlb-pbig{position:absolute;inset:0;display:grid;place-items:center}
.exlb-pbig span{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#111827}
.exlb-pbig span svg{width:26px;height:26px;margin-left:3px}
.exlb-cap{padding:14px 16px 3px;font-size:15px;font-weight:700}
.exlb-note{padding:0 16px 16px;font-size:12px;color:var(--color-text-soft)}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--color-text);color:#fff;font-size:13px;font-weight:500;border-radius:var(--r-md);padding:10px 16px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:all .2s;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast a{color:#9EC5FF;font-weight:700;cursor:pointer}

/* plan-a-session method picker modal */

.ibar .ibval{width:92px;text-align:right;font-variant-numeric:tabular-nums;color:var(--color-text-muted);font-weight:600}

/* ball-in-play strip */
.bipstrip{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--color-border)}
.bipstrip .seg{height:100%}
.bipstrip .live{background:var(--sb-green)} .bipstrip .stop{background:var(--color-surface-muted)} .bipstrip .dead{background:var(--sb-gold)}
.biplegend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--color-text-soft)}
.biplegend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* six things */
.sixlist{list-style:none;display:flex;flex-direction:column;gap:12px}
.sixlist li{display:flex;gap:11px}
.sixlist .sn{width:22px;height:22px;flex:none;border-radius:50%;background:var(--color-primary-soft);color:var(--color-primary-text);font-size:12px;font-weight:700;display:grid;place-items:center}
.sixlist .sx .sxt{font-size:13px;font-weight:700;color:var(--color-text);margin-bottom:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sixlist .sx .sxd{font-size:12.5px;color:var(--color-text-soft);line-height:1.45}

/* needs attention flag cards */
.flagcard{border:1px solid var(--color-border);border-radius:var(--r-md);padding:11px 12px;margin-top:10px}
.flagcard .fct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.flagtheme{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-soft)}
.flagcard .fcm{font-size:12.5px;color:var(--color-text);font-weight:600;line-height:1.4}
.flagcard .fcn{font-size:12px;color:var(--color-text-soft);line-height:1.4;margin-top:3px}
.flagcard .fcl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--color-primary-text);margin-top:7px;cursor:pointer}
.flagcard .fcl svg{width:13px;height:13px}

/* review queue cards */
.rqcard{border:1px solid var(--color-border);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;display:grid;grid-template-columns:200px 1fr;gap:14px}
@media (max-width:720px){.rqcard{grid-template-columns:1fr}}
.rqthumb{aspect-ratio:16/10;background:var(--color-surface-muted);border-radius:var(--r-md);display:grid;place-items:center;color:var(--color-text-disabled);position:relative;overflow:hidden}
.rqthumb .play{width:38px;height:38px;border-radius:50%;background:rgba(17,24,39,.55);display:grid;place-items:center}
.rqthumb .play svg{width:18px;height:18px;color:#fff}
.rqthumb .tcwin{position:absolute;bottom:6px;right:6px;background:rgba(17,24,39,.72);color:#fff;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.rqmeta .rqt{font-size:13.5px;font-weight:700;color:var(--color-text);margin-bottom:4px}
.rqmeta .rqwhere{font-size:12px;color:var(--color-text-soft);margin-bottom:8px}
.rqmeta .rqn{font-size:12.5px;color:var(--color-text-muted);line-height:1.45;margin-bottom:10px}
.rqactions{display:flex;gap:8px;flex-wrap:wrap}
.rqb{height:32px;border-radius:var(--r-md);border:1px solid var(--color-border);background:var(--color-surface);font:inherit;font-size:12.5px;font-weight:600;color:var(--color-text);padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.rqb svg{width:14px;height:14px}
.rqb.confirm{background:var(--color-primary-tint);border-color:var(--color-primary-text);color:var(--color-primary-text)}
.rqb.done{background:var(--c-plan-soft);border-color:var(--c-plan);color:#2f6a1f}
.rqeyebrow{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-soft);margin-bottom:3px}

/* small line chart */
.linechart{width:100%;height:auto;display:block}
.linechart .grid{stroke:var(--color-border-subtle);stroke-width:1}
.linechart .axis{stroke:var(--color-border);stroke-width:1}
.linechart .la{fill:none;stroke:var(--teamA);stroke-width:2}
.linechart .lb{fill:none;stroke:var(--teamB);stroke-width:2}
.linechart .lad{fill:var(--teamA)} .linechart .lbd{fill:var(--teamB)}
.linechart text{font-size:9px;fill:var(--color-text-soft)}

/* delivery bubble map */
.bubble{fill:rgba(37,99,201,.18);stroke:var(--teamA);stroke-width:1.4}
.bubblelab{font-size:9px;font-weight:700;fill:var(--color-text);text-anchor:middle}
.bubblesub{font-size:7.5px;fill:var(--color-text-soft);text-anchor:middle}

.footnote{font-size:11px;color:var(--color-text-soft);line-height:1.45;margin-top:10px}
.sessmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--color-text-soft);margin-top:4px}
.sessmeta .mp{display:inline-flex;align-items:center;gap:5px}
.sessmeta .mp svg{width:14px;height:14px}

    var gp=list.filter(function(p){return p.grp===g;});
    if(!gp.length) return;
    body += '<tr class="grp"><td colspan="'+(cols.length+1)+'">'+GRPN[g]+'</td></tr>';
    gp.forEach(function(p){
      body += '<tr><td><span class="pcell"><span class="tteam '+p.team+'"></span>P'+p.n+' <span style="color:var(--color-text-soft);font-weight:500">'+p.pos+'</span></span></td>'
        + cols.map(function(c){
            var v=p[c[0]]; if(v==null) return '<td class="num">–</td>';
            var cls='';
            if(shadeCols[c[0]]){ var m=MED[c[0]]; if(v>=m*1.25) cls=' class="cell-hi"'; else if(v<=m*0.75) cls=' class="cell-lo"'; }
            var disp = c[0]==='scans'?v.toFixed(2):(c[0]==='ad'?v.toFixed(2):v);
            return '<td class="num"><span'+cls+' style="padding:1px 5px">'+disp+'</span></td>';
          }).join('')
        + '</tr>';
    });
  });
  body += '<tr class="sumrow"><td>Squad median</td>'+cols.map(function(c){var v=MED[c[0]];return '<td class="num">'+(c[0]==='scans'||c[0]==='ad'?v.toFixed(2):v)+'</td>';}).join('')+'</tr>';
  return '<div class="pcard"><div class="pch"><div class="pct">Every player, both games (43 min) '+chip('gps')+' '+chip('video')+'</div></div>'
    + '<div class="pcsub">Shaded cells sit far from the median of the player’s own group (green above, red below) — start with those rows. Team split illustrative.</div>'
    + '<div style="overflow-x:auto"><table class="dtable"><thead><tr><th>Player</th>'+cols.map(function(c){return '<th class="num">'+c[1]+'</th>';}).join('')+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
};

function rqCard(r){
  var cl={low:'low',med:'med',high:'high'}[r.conf];
  return '<div class="rqcard" data-rq="'+r.n+'">'
    + '<div class="rqthumb"><span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="tcwin">Clip '+r.n+' · '+r.win+'</span></div>'
    + '<div class="rqmeta"><div class="rqeyebrow">'+r.where+'</div><div class="rqt">'+r.t+'</div>'
    + '<div class="rqn">'+r.note+'</div>'
    + '<div style="margin-bottom:10px"><span class="conf '+cl+'">'+(r.conf==='med'?'Medium':'Low')+' confidence</span></div>'
    + '<div class="rqactions"><button class="rqb confirm" data-v="Confirmed"><i data-lucide="check"></i>Confirm</button>'
    + '<button class="rqb" data-v="Corrected"><i data-lucide="pencil"></i>Correct</button>'
    + '<button class="rqb" data-v="Dismissed"><i data-lucide="x"></i>Dismiss</button></div></div></div>';
}

/* ====================== SVG VISUALS ====================== */
/* pitch coordinate maps: viewBox 0 0 200 128 */
function formation(team, phase){
  // returns array of {x,y,lab}
  var pts=[], pls, baseX, dir;
  if(team==='A'){ pls=['01','02','03','05','11','08','12','15','16','19']; }
  else { pls=['04','06','07','09','10','13','14','17','18','08']; }
  var push=phase==='in'? (team==='A'?16:-16) : 0;
  function col(x,ys,names){ ys.forEach(function(y,i){ pts.push({x:x,y:y,lab:names[i]}); }); }
  if(team==='A'){
    col(34+push,[22,48,80,106],[pls[0],pls[1],pls[2],pls[3]]);
    col(70+push,[34,64,94],[pls[4],pls[5],pls[6]]);
    col(96+push,[30,64,98],[pls[7],pls[8],pls[9]]);
  } else {
    col(166+push,[22,48,80,106],[pls[0],pls[1],pls[2],pls[3]]);
    col(130+push,[34,64,94],[pls[4],pls[5],pls[6]]);
    col(104+push,[30,64,98],[pls[7],pls[8],pls[9]]);
  }
  return pts;
}
function pitchMap(phase){
  var W=200,H=128;
  var lines='<rect class="line" x="3" y="3" width="'+(W-6)+'" height="'+(H-6)+'"/>'
    + '<line class="line" x1="'+(W/2)+'" y1="3" x2="'+(W/2)+'" y2="'+(H-3)+'"/>'
    + '<circle class="line" cx="'+(W/2)+'" cy="'+(H/2)+'" r="16"/>'
    + '<rect class="line" x="3" y="'+(H/2-28)+'" width="30" height="56"/>'
    + '<rect class="line" x="'+(W-33)+'" y="'+(H/2-28)+'" width="30" height="56"/>';
  function dots(team){
    var pts=formation(team,phase);
    var col=team==='A'?'var(--teamA)':'var(--teamB)';
    var hull=[pts[0],pts[7],pts[9],pts[3]]; // def-top, fwd-top, fwd-bot, def-bot
    var poly='<polygon class="shape'+(team==='B'?' shapeB':'')+'" points="'+hull.map(function(p){return p.x+','+p.y;}).join(' ')+'"/>';
    var d=pts.map(function(p){ return '<circle class="pdot" cx="'+p.x+'" cy="'+p.y+'" r="6.5" fill="'+col+'"/><text class="plab" x="'+p.x+'" y="'+p.y+'">'+(+p.lab)+'</text>'; }).join('');
    return poly+d;
  }
  var content='';
  if(state.team==='all'){ content=dots('A')+dots('B'); }
  else { content=dots(state.team); }
  return '<svg class="pitch" viewBox="0 0 '+W+' '+H+'">'+lines+content+'</svg>';
}

function backlineChart(){
  var W=320,H=150,pad=22;
  var A=[20,24,31,27,22,28,25,30,23], B=[22,26,24,28,23,25,27,24,26];
  var labs=['0-3','3-6','6-9','9-12','12-15','15-18','18-21','21-24','24-27'];
  var ymin=10,ymax=35;
  function X(i){ return pad + i*((W-pad-6)/(A.length-1)); }
  function Y(v){ return (H-18) - (v-ymin)/(ymax-ymin)*(H-18-6); }
  function path(arr){ return arr.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' '); }
  var grid='';
  [15,20,25,30].forEach(function(g){ grid+='<line class="grid" x1="'+pad+'" y1="'+Y(g)+'" x2="'+(W-6)+'" y2="'+Y(g)+'"/><text x="2" y="'+(Y(g)+3)+'">'+g+'</text>'; });
  var show=state.team;
  var lines='';
  if(show==='all'||show==='A') lines+='<path class="la" d="'+path(A)+'"/>'+A.map(function(v,i){return '<circle class="lad" cx="'+X(i)+'" cy="'+Y(v)+'" r="2.5"/>';}).join('');
  if(show==='all'||show==='B') lines+='<path class="lb" d="'+path(B)+'"/>'+B.map(function(v,i){return '<circle class="lbd" cx="'+X(i)+'" cy="'+Y(v)+'" r="2.5"/>';}).join('');
  var xl=labs.map(function(l,i){ return i%2===0?'<text x="'+X(i)+'" y="'+(H-4)+'" text-anchor="middle">'+l+'</text>':''; }).join('');
  return '<svg class="linechart" viewBox="0 0 '+W+' '+H+'"><line class="axis" x1="'+pad+'" y1="6" x2="'+pad+'" y2="'+(H-18)+'"/><line class="axis" x1="'+pad+'" y1="'+(H-18)+'" x2="'+(W-6)+'" y2="'+(H-18)+'"/>'+grid+lines+xl+'</svg>';
}

function deliveryMap(){
  var W=320,H=190;
  // goal box at top, bubbles for zones
  var frame='<rect class="line" x="20" y="14" width="280" height="150"/><rect class="line" x="90" y="14" width="140" height="44"/><rect class="line" x="130" y="14" width="60" height="20"/><line class="line" x1="20" y1="14" x2="300" y2="14" stroke-width="2.5"/>';
  var zones=[
    {x:90,y:70,r:26,lab:'1/3',sub:'Far post'},
    {x:160,y:92,r:40,lab:'4/10',sub:'Six-yard central'},
    {x:230,y:70,r:26,lab:'3/6',sub:'Near post'},
    {x:160,y:150,r:30,lab:'4/7',sub:'Cut-backs'}
  ];
  var b=zones.map(function(z){ return '<circle class="bubble" cx="'+z.x+'" cy="'+z.y+'" r="'+z.r+'"/><text class="bubblelab" x="'+z.x+'" y="'+(z.y-2)+'">'+z.lab+'</text><text class="bubblesub" x="'+z.x+'" y="'+(z.y+9)+'">'+z.sub+'</text>'; }).join('');
  return '<svg class="pitch" viewBox="0 0 '+W+' '+H+'" style="background:#F4F7F3">'+frame+b+'</svg>';
}

function bipStrip(){
  // segments across 27 min: live 66%, stops + dead
  var segs=[['live',28],['dead',6],['live',20],['stop',10],['live',18],['dead',5],['live',13]];
  return '<div class="bipstrip">'+segs.map(function(s){return '<div class="seg '+s[0]+'" style="width:'+s[1]+'%"></div>';}).join('')+'</div>';
}
